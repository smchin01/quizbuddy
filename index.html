<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS SAA-C03 Quiz</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

  <!-- ── Home Screen ─────────────────────────────────────────────────────── -->
  <div id="screen-home" class="screen">
    <div class="container">
      <header>
        <h1>AWS SAA-C03</h1>
        <p class="subtitle">Solutions Architect Associate Practice Quiz</p>
      </header>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="stat-total">—</div>
          <div class="stat-label">Total Questions</div>
        </div>
        <div class="stat-card mastered">
          <div class="stat-value" id="stat-mastered">—</div>
          <div class="stat-label">Mastered</div>
        </div>
        <div class="stat-card review">
          <div class="stat-value" id="stat-review">—</div>
          <div class="stat-label">In Review</div>
        </div>
        <div class="stat-card remaining">
          <div class="stat-value" id="stat-remaining">—</div>
          <div class="stat-label">Untouched</div>
        </div>
      </div>

      <div class="quiz-setup card">
        <p id="available-label" class="available-label"></p>
        <div class="count-row">
          <label for="quiz-count">Questions in this quiz:</label>
          <input type="number" id="quiz-count" min="1" value="20">
        </div>
        <div class="btn-row">
          <button id="start-btn" class="btn btn-primary" onclick="startQuiz()">Start Quiz</button>
          <button class="btn btn-danger" onclick="resetAll()">Reset All Progress</button>
        </div>
      </div>

      <p class="footer-note">Progress is saved in your browser. Reset to start fresh.</p>
    </div>
  </div>

  <!-- ── Quiz Screen ─────────────────────────────────────────────────────── -->
  <div id="screen-quiz" class="screen">
    <div class="quiz-header">
      <div class="progress-bar-wrap">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div class="quiz-meta">
        <span id="progress-text">Question 1 of 20</span>
        <span id="source-ref" class="source-ref"></span>
        <span id="review-badge" class="badge review-badge" style="display:none">⚑ Review</span>
      </div>
    </div>

    <div class="container quiz-body">
      <p id="multi-hint" class="multi-hint" style="display:none"></p>
      <p id="question-text" class="question-text"></p>
      <ul id="options-list" class="options-list"></ul>
      <div id="feedback" class="feedback" style="display:none"></div>
      <div id="explanation" class="explanation" style="display:none"></div>
      <div class="btn-row" style="margin-top:1.5rem">
        <button id="submit-btn" class="btn btn-primary" onclick="submitAnswer()">Submit Answer</button>
        <button id="next-btn" class="btn btn-primary" onclick="nextQuestion()" style="display:none">Next Question</button>
        <button class="btn btn-ghost" onclick="quitQuiz()">Quit</button>
      </div>
    </div>
  </div>

  <!-- ── Results Screen ─────────────────────────────────────────────────── -->
  <div id="screen-results" class="screen">
    <div class="container">
      <div class="results-header">
        <h2>Quiz Complete!</h2>
        <div class="score-display" id="score-display">—</div>
        <div id="score-pct" class="score-pct">—</div>
        <div class="results-stats">
          <span>📚 In Review: <strong id="result-review">—</strong></span>
          <span>🆕 Untouched: <strong id="result-remaining">—</strong></span>
        </div>
      </div>

      <div class="btn-row" style="justify-content:center">
        <button class="btn btn-primary" onclick="renderHome()">Take Another Quiz</button>
        <button class="btn btn-secondary" onclick="renderHome()">Go Home</button>
      </div>

      <div id="breakdown" class="breakdown"></div>
    </div>
  </div>

  <!-- ── Mastered List Screen ──────────────────────────────────────────── -->
  <div id="screen-list" class="screen">
    <div class="quiz-header">
      <div class="list-header-row">
        <button class="btn btn-ghost" onclick="renderHome()">← Back</button>
        <div class="list-header-info">
          <span id="list-title" style="font-weight:700"></span>
          <span id="list-count" class="list-count"></span>
        </div>
      </div>
    </div>
    <div class="container">
      <div id="list-items" class="list-items"></div>
    </div>
  </div>

  <script src="app.js?v=4"></script>
</body>
</html>
